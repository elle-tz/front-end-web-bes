<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Maratona - Avalie o que você assistiu</title>

        <!-- carregando fontes do Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />

        <!-- estilo externo, em arquivo separado -->
        <link rel="stylesheet" href="global.css" />
    </head>
    <body>
        <header>
            <h1>Maratona</h1>
            <p>Registre e avalie o que você acabou de maratonar</p>
        </header>

        <main>
            <section>
                <h2>Nova avaliação</h2>
                <form action="https://postman-echo.com/post" method="post">

                    <fieldset>
                        <legend>O que você assistiu</legend>

                        <div class="campo">
                            <label for="apelido_id">Seu apelido:</label>
                            <input id="apelido_id" name="apelido" type="text" required placeholder="Ex: cinéfilo_92">
                        </div>

                        <div class="campo">
                            <label for="titulo_id">Título do filme ou série:</label>
                            <input id="titulo_id" name="titulo" type="text" placeholder="Ex: Interestelar">
                        </div>

                        <div class="campo">
                            <label for="tipo_id">Tipo:</label>
                            <select id="tipo_id" name="tipo">
                                <option value="filme">Filme</option>
                                <option value="serie">Série</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="ano_id">Ano de lançamento:</label>
                            <input id="ano_id" name="ano" type="text" pattern="^(19|20)[0-9]{2}$" placeholder="Ex: 2014">
                        </div>

                        <div class="campo">
                            <label for="capa_id">Capa do filme/série:</label>
                            <input id="capa_id" name="capa" type="file" accept="image/*">
                        </div>

                        <div class="campo">
                            <label for="data_id">Data que terminou de assistir:</label>
                            <input id="data_id" name="data_termino" type="date">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Gêneros</legend>

                        <div class="campo-linha">
                            <input id="genero_acao_id" name="generos" type="checkbox" value="acao">
                            <label for="genero_acao_id">Ação</label>
                        </div>
                        <div class="campo-linha">
                            <input id="genero_comedia_id" name="generos" type="checkbox" value="comedia">
                            <label for="genero_comedia_id">Comédia</label>
                        </div>
                        <div class="campo-linha">
                            <input id="genero_drama_id" name="generos" type="checkbox" value="drama">
                            <label for="genero_drama_id">Drama</label>
                        </div>
                        <div class="campo-linha">
                            <input id="genero_terror_id" name="generos" type="checkbox" value="terror">
                            <label for="genero_terror_id">Terror</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Sua avaliação</legend>

                        <div class="campo">
                            <label>Sua nota:</label>
                            <div class="estrelas">
                                <input type="radio" id="estrela5" name="nota" value="5"><label for="estrela5">★</label>
                                <input type="radio" id="estrela4" name="nota" value="4"><label for="estrela4">★</label>
                                <input type="radio" id="estrela3" name="nota" value="3"><label for="estrela3">★</label>
                                <input type="radio" id="estrela2" name="nota" value="2"><label for="estrela2">★</label>
                                <input type="radio" id="estrela1" name="nota" value="1"><label for="estrela1">★</label>
                            </div>
                        </div>

                        <div class="campo">
                            <label for="resenha_id">Sua opinião:</label>
                            <textarea id="resenha_id" name="resenha" placeholder="Sem spoilers, por favor!"></textarea>
                        </div>

                        <div class="campo-linha">
                            <input id="recomenda_sim_id" name="recomenda" type="radio" value="sim">
                            <label for="recomenda_sim_id">Recomendo</label>
                        </div>
                        <div class="campo-linha">
                            <input id="recomenda_nao_id" name="recomenda" type="radio" value="nao">
                            <label for="recomenda_nao_id">Não recomendo</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Streaming</legend>
                        <div class="campo">
                            <label for="plataforma_id">Onde você assistiu:</label>
                            <select id="plataforma_id" name="plataforma">
                                <option value="netflix">Netflix</option>
                                <option value="prime">Prime Video</option>
                                <option value="hbo">HBO Max</option>
                                <option value="disney">Disney+</option>
                                <option value="outra">Outra</option>
                            </select>
                        </div>
                    </fieldset>

                    <div class="botoes">
                        <button type="reset">Limpar</button>
                        <button type="submit">Salvar avaliação</button>
                    </div>

                </form>
            </section>
        </main>

        <footer>
            <p>Todos os direitos reservados &copy;</p>
        </footer>
    </body>
</html>
